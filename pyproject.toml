[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursorgen"
version = "0.1.3"
description = "A fork of win2xcur that converts Windows cursors to Xcursor while preserving image quality."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["cur", "ani", "x11", "wayland", "windows", "win32", "cursor", "xcursor"]
authors = [{ name = "ashuramaruzxc", email = "ashuramaru@tenjin-dk.com" }]
maintainers = [{ name = "ashuramaruzxc", email = "ashuramaru@tenjin-dk.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Desktop Environment",
]
dependencies = [
    "numpy>=1.21",
    "opencv-python-headless",
    "rich",
    "typing-extensions",
]

[project.urls]
"Homepage" = "https://github.com/ashuramaruzxc/cursorgen"
"Bug Reports" = "https://github.com/ashuramaruzxc/cursorgen/issues"
"Source" = "https://github.com/ashuramaruzxc/cursorgen"
[project.scripts]
cursorgen = "cursorgen.__main__:main"

[project.optional-dependencies]
dev = ["black", "isort", "pyproject-flake8", "mypy", "pre-commit", "build"]

[tool.flake8]
max-line-length = 120
application-import-names = "cursorgen"
import-order-style = "pycharm"
extend-ignore = "E203"

[tool.mypy]
ignore_missing_imports = true
strict = true
plugins = ["numpy.typing.mypy_plugin"]

[tool.black]
line-length = 120
target-version = ["py37", "py38", "py39", "py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 120
