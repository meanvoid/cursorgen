name: Python package
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.7"
            os: ubuntu-22.04
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
          python fetch_samples.py
      - name: Install development tools
        if: matrix.python-version == '3.12'
        run: python -m pip install '.[dev]'
      - name: Run pre-commit
        if: matrix.python-version == '3.12'
        run: python -m pre_commit run --all-files
      - name: Run unit tests
        if: ${{ !contains(fromJSON('["3.7", "3.8", "3.9"]'), matrix.python-version) }}
        run: python -m unittest discover -s tests -v
      - name: Test installed CLI with bundled CUR and ANI samples
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p cursorgen-smoke/static cursorgen-smoke/animated
          cursorgen "$GITHUB_WORKSPACE/sample/crosshair.cur" -o cursorgen-smoke/static
          cursorgen "$GITHUB_WORKSPACE/sample/crosshair.ani" -o cursorgen-smoke/animated
          test -s cursorgen-smoke/static/crosshair
          test -s cursorgen-smoke/animated/crosshair
      - name: Test with dmz-cursor-theme
        if: matrix.python-version == '3.12'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes dmz-cursor-theme
          mkdir dmz-white
          cursorgen /usr/share/icons/DMZ-White/cursors/* -o dmz-white
          test -n "$(find dmz-white -type f -print -quit)"
