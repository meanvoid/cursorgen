name: Renovate

on:
  schedule:
    - cron: "37 0 */2 * *"
  push:
    branches: [master]
    paths:
      - .github/renovate.json
      - .github/renovate/**
      - .github/workflows/renovate.yaml
      - flake.nix
      - flake.lock
      - pyproject.toml
      - .pre-commit-config.yaml
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Renovate
        run: npm ci --prefix .github/renovate
      - name: Validate configuration
        run: npm run --prefix .github/renovate validate
      - name: Update dependencies without PRs
        run: .github/renovate/node_modules/.bin/renovate
        env:
          LOG_LEVEL: info
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
